[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "churniq"
version = "0.1.0"
description = "End-to-end customer churn analytics and retention decision project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "seaborn>=0.13", "joblib>=1.3", "streamlit>=1.32"]
[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
[project.scripts]
churniq = "churniq.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
